<div>
  <div class="buttonsPanel">
    <h1 class="title">Administracja</h1>
    <span class="buttons">
      <div class="button" routerLink="/">Powrót</div>
      <div class="button" routerLink="/admin/categories" *ngIf="isLoggedIn()">
        Kategorie
      </div>
      <div class="button" routerLink="/admin/results" *ngIf="isLoggedIn()">
        Wyniki
      </div>
      <div class="button" (click)="logout()" *ngIf="isLoggedIn()">Wyloguj</div>
    </span>
  </div>
  <div class="router-outlet">
    <router-outlet></router-outlet>
  </div>
</div>

<div class="authBlock" *ngIf="!isLoggedIn()">
  <h2>Logowanie</h2>
  <div class="form-group">
    <input
      type="text"
      class="form-controll"
      placeholder="Użytkownik"
      #userName
      required
    />
  </div>
  <div class="form-group">
    <input
      type="password"
      class="form-controll"
      placeholder="Hasło"
      #userPassword
      required
    />
  </div>
  <div class="form-group">
    <input
      type="button"
      class="btn"
      value="Zaloguj"
      (click)="signIn(userName.value, userPassword.value)"
    />
    <input
      type="button"
      class="btn"
      value="Zarejestruj"
      (click)="signUp(userName.value, userPassword.value)"
    />
  </div>
  <p class="notification">
    Zaloguj się aby uzyskać dostęp do panelu administratora!
  </p>
</div>
