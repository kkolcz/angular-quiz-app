<div class="submitContainer">
  <h2>Gratulacje!</h2>
  <div>
    <p>
      <b>{{ username }}</b
      >, ukończyłeś quiz!
    </p>
    <p>
      Wynik który uzyskałeś to: <b>{{ endQuizData.correctAnswers }}</b> punkty!
    </p>
  </div>
  <p class="notification">{{ notification }}</p>
  <div class="submitButton" (click)="restartQuiz()">Zakończ</div>
</div>
